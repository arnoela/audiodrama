function mdToHtml(md){
  var out=[],lines=md.split('\n'),i=0;
  while(i<lines.length){
    var L=lines[i];
    if(/^#{1,6} /.test(L)){var n=L.match(/^#+/)[0].length;out.push('<h'+Math.min(n+1,6)+'>'+esc(L.replace(/^#+ /,''))+'</h'+Math.min(n+1,6)+'>');i++;continue;}
    if(L.indexOf('| ')===0){var t=[];while(i<lines.length&&lines[i].indexOf('|')===0){t.push(lines[i]);i++;}
      var rows=t.filter(function(l){return !/^\|(\s*---\s*\|)+\s*$/.test(l);}).map(splitRow);
      out.push('<table>'+rows.map(function(r,k){return '<tr>'+r.map(function(c){return (k===0?'<th>':'<td>')+esc(c)+(k===0?'</th>':'</td>');}).join('')+'</tr>';}).join('')+'</table>');continue;}
    if(/^- /.test(L)){out.push('<div>• '+esc(L.slice(2))+'</div>');i++;continue;}
    if(L.trim())out.push('<p>'+esc(L)+'</p>');i++;
  }
  return out.join('\n');
}
